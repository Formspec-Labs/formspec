name: Docs And Contracts

on:
  pull_request:
    paths:
      - "schemas/**"
      - "specs/**"
      - "scripts/generate-spec-artifacts.mjs"
      - "scripts/spec-artifacts.config.json"
      - "tests/conformance/spec/test_cross_spec_contracts.py"
      - "scripts/run-spec-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "specs/**"
      - "scripts/generate-spec-artifacts.mjs"
      - "scripts/spec-artifacts.config.json"
      - "tests/conformance/spec/test_cross_spec_contracts.py"
      - "scripts/run-spec-contract-tests.mjs"
      - "package.json"
      - "package-lock.json"

jobs:
  docs-check:
    if: github.repository == 'Formspec-Labs/formspec'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - name: Check out the fel-core sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formspec/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: formspec/pyproject.toml

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formspec

      - name: Install Python package and test runner
        run: |
          python -m pip install --upgrade pip maturin pytest "jsonschema[format]" referencing msgspec
          pip install -e ".[test]"
          pip install --no-build-isolation ./crates/formspec-py

      - name: Install Node dependencies
        run: npm ci

      - name: Run schema/spec gate checks
        run: npm run docs:check
