name: CI

# Rust crates use relative paths to the fel-core and integrity-stack siblings.
# JavaScript build jobs also build the sibling integrity-canonical package before npm packages.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-tests:
    name: Unit Tests (TS)
    # The WASM is built in its pinned arm64 image; an arm64 runner runs it natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - name: Check out the integrity-stack sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/integrity-stack
          path: integrity-stack
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formspec/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: formspec/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formspec
      - run: pip install maturin
      - run: pip install -e ".[test]"
      - run: pip install --no-build-isolation ./crates/formspec-py
      - name: Build the integrity-canonical sibling
        working-directory: integrity-stack
        run: npm ci --workspace packages/integrity-canonical && npm run build --workspace packages/integrity-canonical
      - run: npm ci
      - run: npm run build
      - name: Set up Chromium for the Definition Walk tests
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run test:unit
      - run: npm run test:scripts
      - run: npm run test:packed --workspace=@formspec-org/react
      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
      - name: Packed @formspec-org/react probe on the Node 20.19 floor
        run: node packages/formspec-react/scripts/test-packed.mjs

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - name: Check out the integrity-stack sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/integrity-stack
          path: integrity-stack
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: formspec/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formspec
      - run: pip install maturin
      - run: pip install -e ".[test]"
      - run: pip install --no-build-isolation ./crates/formspec-py
      - run: pytest --ignore=tests/e2e

  e2e-tests:
    name: E2E Tests
    # The WASM is built in its pinned arm64 image; an arm64 runner runs it natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - name: Check out the integrity-stack sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/integrity-stack
          path: integrity-stack
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: formspec/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: formspec/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formspec
      - run: pip install maturin
      - run: pip install -e ".[test]" fastapi "uvicorn[standard]" pydantic
      - run: pip install --no-build-isolation ./crates/formspec-py
      - name: Build the integrity-canonical sibling
        working-directory: integrity-stack
        run: npm ci --workspace packages/integrity-canonical && npm run build --workspace packages/integrity-canonical
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  rust-tests:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - name: Check out the integrity-stack sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/integrity-stack
          path: integrity-stack
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: formspec/pyproject.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: formspec
      - run: cargo nextest run --workspace
