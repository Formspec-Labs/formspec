name: Publish

on:
  push:
    branches: [main]

# Top-level concurrency: never overlap two publish runs on main.
concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    if: github.repository == 'Formspec-Labs/formspec'
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - name: Check out the fel-core sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; Node 22 images still ship npm 10.x.
      - name: Install npm for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack and wasm-opt
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get install -y binaryen
      - run: npm install
      - run: npm run build

  release:
    # One release train. ADR 0063's four velocity tiers still shape the changesets (fixed groups, tier
    # sentinels, per-tier CHANGELOGs), but they cannot each drive their own changesets/action job: that
    # action's `branch` input is the *base* branch and its head is always `changeset-release/<base>`, so
    # four tier jobs would share one head and clobber each other (every run died on
    # `changeset-release/changeset-release/<tier>`). One job, one "Version Packages" PR, one
    # `changeset publish` under `latest`; a tier cadence, if wanted later, is a scheduling choice on
    # top of this, not a matrix.
    needs: build
    if: github.repository == 'Formspec-Labs/formspec'
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: formspec
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - name: Check out the fel-core sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm for Trusted Publishing
        run: npm install -g npm@^11.5.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack and wasm-opt
        run: |
          curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          sudo apt-get install -y binaryen
      - run: npm install
      - run: npm run build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: formspec
          version: npm run version
          publish: npm run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
