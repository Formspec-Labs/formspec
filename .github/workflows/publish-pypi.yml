name: Publish PyPI

# The wheels build from this repository plus its public `fel-core` sibling, checked out beside it: the
# extension crate depends on fel-core by relative path (see Cargo.toml).
on:
  push:
    tags: ["py-v*"]
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  # ── Platform wheels (maturin + Rust) ───────────────────────────────
  build-wheels:
    if: github.repository == 'Formspec-Labs/formspec'
    name: Wheels (${{ matrix.os }} ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: x86_64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      # The repository carries content-addressed spike artifacts whose paths exceed Windows's default
      # 260-character limit; Git needs long paths on before the checkout, or it fails mid-clone.
      - name: Allow long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          path: formspec
      - name: Check out the fel-core sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: formspec
          target: ${{ matrix.target }}
          args: --release --out dist -i python3.12
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: formspec/dist/*.whl

  # ── Source distribution ────────────────────────────────────────────
  build-sdist:
    if: github.repository == 'Formspec-Labs/formspec'
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: formspec
      - name: Check out the fel-core sibling
        uses: actions/checkout@v6
        with:
          repository: Formspec-Labs/fel-core
          path: fel-core
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: formspec
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: formspec/dist/*.tar.gz

  # ── Publish to PyPI via trusted publishing ─────────────────────────
  publish:
    if: github.repository == 'Formspec-Labs/formspec'
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A re-run after a partial upload pushes only the files PyPI does not have yet.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
