[workspace]
# This workspace builds from a checkout of THIS repository plus one public sibling, `fel-core` — what the
# npm packages, the WASM bundle and the Python extension are made of, and what a clone of formspec alone
# can resolve. The crates below carry the signature family, whose dependencies live in the private sibling
# `integrity-stack`; cargo must resolve every member's manifest before it does anything, so keeping them in
# would make a lone checkout unbuildable. They are excluded, not deleted: `make test-rust` runs them
# whenever that sibling is present, which is how the stack and a developer's tree see them.
members = [
    "crates/formspec-changeset",
    "crates/formspec-core",
    "crates/formspec-eval",
    "crates/formspec-lint",
    "crates/formspec-py",
    "crates/formspec-wasm",
]
exclude = [
    "crates/formspec-cross-stack-fixture-harness",
    "crates/formspec-signature-adapter-ring",
    "crates/formspec-signature-cose",
    "crates/formspec-signature-port",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
