[workspace]
# This workspace resolves path dependencies from the public `fel-core` and `integrity-stack` siblings.
# The signature crates listed under `exclude` have separate manifests. `make test-rust` runs their tests
# when `integrity-stack` is present.
members = [
    "crates/formspec-changeset",
    "crates/formspec-core",
    "crates/formspec-document-kernel",
    "crates/formspec-eval",
    "crates/formspec-lint",
    "crates/formspec-py",
    "crates/formspec-wasm",
]
exclude = [
    "crates/formspec-cross-stack-fixture-harness",
    "crates/formspec-signature-adapter-ring",
    "crates/formspec-signature-cose",
    "crates/formspec-signature-port",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
ring = "0.17"
base64 = { version = "0.22", default-features = false }
thiserror = "1"


[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
