# Its own workspace root: this crate's dependencies live in the private `integrity-stack` sibling, so it is
# excluded from the repository workspace (see ../../Cargo.toml) and builds where that sibling is checked out.
[workspace]

[package]
name = "formspec-signature-port"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Formspec signature verifier port — Verifier trait, VerificationReceipt, and registry types (no crypto deps)"
repository = "https://github.com/Formspec-org/formspec"

[dependencies]
integrity-signature = { path = "../../../integrity-stack/crates/integrity-signature" }
