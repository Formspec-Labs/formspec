# Its own workspace root: this crate's dependencies live in the private `integrity-stack` sibling, so it is
# excluded from the repository workspace (see ../../Cargo.toml) and builds where that sibling is checked out.
[workspace]

[package]
name = "formspec-signature-adapter-ring"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Formspec ring-crypto signature adapter — implements Verifier port using ring"
repository = "https://github.com/Formspec-Labs/formspec"
# Not on crates.io until the integrity-stack crates this depends on are: they are path siblings today.
publish = false

[dependencies]
formspec-signature-cose = { version = "0.1.0", path = "../formspec-signature-cose" }
formspec-signature-port = { version = "0.1.0", path = "../formspec-signature-port" }
integrity-signature-ring = { path = "../../../integrity-stack/crates/integrity-signature-ring" }
ring = "0.17"

[dev-dependencies]
