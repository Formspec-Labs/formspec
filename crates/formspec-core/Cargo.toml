[package]
name = "formspec-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formspec core processing — FEL analysis, path utils, schema validation, assembler"
repository = "https://github.com/Formspec-Labs/formspec"

[dependencies]
fel-core = { version = "0.3.0", path = "../../../fel-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
proptest = "1"
