[package]
name = "formspec-eval"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Formspec definition batch evaluator: rebuild, recalculate, revalidate, and NRB output shaping"
repository = "https://github.com/Formspec-Labs/formspec"

[features]
create = []

[dependencies]
integrity-canonical = { version = "0.1.0", path = "../../../integrity-stack/crates/integrity-canonical" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fancy-regex = "0.14"
fel-core = { version = "0.3.0", path = "../../../fel-core" }
formspec-core = { version = "0.2.0", path = "../formspec-core", default-features = false }
rust_decimal = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver_rs = "0.2.0"
thiserror = { workspace = true }
url = "2"

# Integration tests call `fel_core` directly (round-trip checks); keep this explicit.
[dev-dependencies]
formspec-eval = { path = ".", features = ["create"] }
fel-core = { version = "0.3.0", path = "../../../fel-core" }

[[test]]
name = "integration"
path = "tests/integration/mod.rs"
