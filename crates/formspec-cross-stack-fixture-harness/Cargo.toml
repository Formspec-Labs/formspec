# Its own workspace root: this crate's dependencies live in the private `integrity-stack` sibling, so it is
# excluded from the repository workspace (see ../../Cargo.toml) and builds where that sibling is checked out.
[workspace]

[package]
name = "formspec-cross-stack-fixture-harness"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cross-stack fixture bundle harness — walks D4 bundles and asserts manifest validity"
repository = "https://github.com/Formspec-Labs/formspec"
# Not on crates.io until the integrity-stack crates this depends on are: they are path siblings today.
publish = false

[dependencies]
integrity-canonical = { path = "../../../integrity-stack/crates/integrity-canonical" }
integrity-bundle-fixtures = { path = "../../../integrity-stack/crates/integrity-bundle-fixtures" }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
ciborium = "0.2"
formspec-signature-adapter-ring = { path = "../formspec-signature-adapter-ring" }
formspec-signature-cose = { path = "../formspec-signature-cose" }
formspec-signature-port = { path = "../formspec-signature-port" }
integrity-cose = { path = "../../../integrity-stack/crates/integrity-cose" }
integrity-cbor = { path = "../../../integrity-stack/crates/integrity-cbor", features = ["json"] }
jsonschema = { version = "0.45", default-features = false }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
